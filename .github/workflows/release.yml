name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del lanzamiento (ej. 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test with Maven
        run: |
          .\mvnw.cmd clean test
          .\mvnw.cmd package -DskipTests

      - name: Resolve Release Version
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -and $ref.StartsWith('v')) {
            $ver = $ref.TrimStart('v')
            $tag = $ref
          } elseif ("${{ github.event.inputs.version }}") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
            $tag = "v$ver"
          } else {
            $ver = "0.1.0"
            $tag = "v0.1.0"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$ver"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
          Write-Host "Version calculada: $ver (Tag: $tag)"

      - name: Prepare Package Input
        run: |
          New-Item -ItemType Directory -Force -Path target\package-input
          New-Item -ItemType Directory -Force -Path target\dist
          .\mvnw.cmd dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target\package-input
          Copy-Item target\gitobserver-*.jar target\package-input\ -Force

      - name: Create App Image with jpackage
        run: |
          jpackage `
            --type app-image `
            --dest target\dist `
            --name GitObserver `
            --icon "src\main\resources\icons\app.ico" `
            --input target\package-input `
            --main-jar (Get-ChildItem target\package-input\gitobserver-*.jar | Select-Object -ExpandProperty Name) `
            --main-class com.gitobserver.Launcher `
            --app-version $env:APP_VERSION `
            --vendor "Milton Andres Guerrero S." `
            --description "Monitor de GitHub para colaboradores y repositorios"

      - name: Create Windows Installer (.exe) with jpackage & WiX
        run: |
          jpackage `
            --type exe `
            --dest target\dist `
            --name "GitObserver-Setup" `
            --icon "src\main\resources\icons\app.ico" `
            --app-image target\dist\GitObserver `
            --app-version $env:APP_VERSION `
            --vendor "Milton Andres Guerrero S." `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path target\dist\GitObserver\* -DestinationPath "target\dist\GitObserver-portable-$($env:APP_VERSION).zip" -Force

      - name: Verify Artifacts for Release
        run: |
          Write-Host "Archivos generados para el release:"
          Get-ChildItem target\dist -File | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: |
            target/dist/GitObserver-Setup-*.exe
            target/dist/GitObserver-portable-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
